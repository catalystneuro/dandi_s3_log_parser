# A stand-in geolocation of the requesters in the example logs, loaded into a `MappingRegionResolver` by the
# `mocked_region_resolver` test fixture so that the summaries have resolved regions to report.
#
# Every requester of the example logs is a documentation-range address (RFC 5737), which a real resolution
# labels `bogon` rather than any place. The regions below are invented, and are spread over enough distinct
# places for a `by_region.tsv` to clear its disclosure threshold and be published.
#
# 203.0.113.1 is deliberately absent, so that its activity is summarized under the unresolved `missing` label
# and cannot count toward that threshold.
192.0.2.0: US/California
192.0.2.1: US/New York
192.0.2.2: CA/Ontario
198.51.100.0: DE/Berlin
198.51.100.1: JP/Tokyo
203.0.113.0: AU/Victoria
